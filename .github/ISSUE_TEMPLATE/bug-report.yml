name: Bug report
description: Report a reproducible Astra defect
title: "[BUG]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include secrets here. Use private vulnerability reporting from SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the visible behavior and the operation state Astra displayed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the expected behavior and expected effect boundary.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      placeholder: |
        1. Start from commit...
        2. Run...
        3. Choose...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add redacted logs, state transitions, diffs, or screenshots that demonstrate the result.
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Astra revision
      description: Commit SHA or branch name.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Bun version, and terminal.
      placeholder: macOS 26, arm64, Bun 1.3.14, Ghostty
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I removed secrets, credentials, personal data, and proprietary code from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
